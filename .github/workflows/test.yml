name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --all-groups

      - name: Compile Python files
        run: uv run python -m compileall worker.py app tests

      - name: Check web interface JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path("app/web_app.py").read_text(encoding="utf-8")
          html = source.split("WEB_APP_HTML = r'''", 1)[1].rsplit("'''", 1)[0]
          match = re.search(r"<script>(.*?)</script>", html, flags=re.S)
          if not match:
              raise SystemExit("No inline application script found")
          Path("/tmp/family-budget-app.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/family-budget-app.js

      - name: Run tests
        env:
          PYTHONPATH: .
        run: uv run pytest -vv
